<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Článek — Vanaheim News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SEO tags below are filled per article by the loader script -->
  <meta name="description" content="Článek ze školního magazínu Vanaheim News.">
  <link rel="canonical" href="https://www.vanaheim-news.cz/">
  <link rel="icon" href="/logo.png">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Vanaheim News">
  <meta property="og:title" content="Vanaheim News">
  <meta property="og:description" content="Článek ze školního magazínu Vanaheim News.">
  <meta property="og:image" content="https://www.vanaheim-news.cz/logo.png">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Page-specific overrides — keeps the design system from style.css. */
    .article-page { max-width: 760px; }
    .article-hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #eaeaea;
      border: 1px solid var(--content-rule);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
    }
    .article-hero img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .article-title { font-size: clamp(1.8rem, 3.4vw, 2.4rem); margin: 0 0 12px; line-height: 1.2; }
    .article-meta {
      display: flex; flex-wrap: wrap; gap: 8px 16px;
      color: var(--muted); font-size: 0.92rem; margin-bottom: 24px;
    }
    .article-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
    .article-body { font-size: 1.05rem; line-height: 1.7; }
    .article-body p { margin: 0 0 1em; white-space: pre-wrap; }
    .article-back {
      display: inline-flex; align-items: center; gap: 8px;
      margin-bottom: 24px;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
    }
    .article-back:hover { color: var(--content-fg); }
    .loading-state, .error-state {
      padding: 40px; text-align: center; color: var(--muted);
      border: 1px dashed var(--content-rule); border-radius: 4px;
      background: var(--surface);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Přejít k obsahu</a>

  <!-- ===== Header (same layout as index) ===== -->
  <header class="site-header" id="sidebar">
    <div class="header-top">
      <svg class="header-divider" width="100%" height="220" aria-hidden="true" focusable="false">
        <path class="hd-line" d="M4000 110 L480 110 L394 24 L0 24" vector-effect="non-scaling-stroke"/>
        <path class="hd-line" d="M480 110 L394 196 L0 196" vector-effect="non-scaling-stroke"/>
      </svg>
      <a class="site-logo" href="./#home" aria-label="Vanaheim News — domů">
        <img src="/logo.png" alt="Vanaheim News — By Expediční Střední ScioŠkola">
      </a>
      <nav class="site-nav" aria-label="Hlavní navigace">
        <a href="./#home"     class="nav-link">Domů</a>
        <a href="./#articles" class="nav-link">Příspěvky</a>
        <a href="./#about"    class="nav-link">O nás</a>
        <a href="./#contact"  class="nav-link">Kontakt</a>
      </nav>
      <button class="burger" id="burger" type="button"
              aria-controls="sidebar" aria-expanded="false" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <main id="main" class="content">
    <article class="page is-active article-page" id="article-root">
      <a class="article-back" href="./#articles">← Zpět na příspěvky</a>
      <p class="loading-state" id="loading">Načítám článek…</p>
    </article>
  </main>

  <script src="/sanitize.js"></script>
  <script>
    /* Reuse only the burger/drawer logic from the main script. */
    (function () {
      var sidebar = document.querySelector("#sidebar");
      var burger = document.querySelector("#burger");
      var backdrop = document.querySelector("#sidebar-backdrop");
      function close() {
        sidebar.classList.remove("is-open");
        burger.setAttribute("aria-expanded", "false");
        backdrop.hidden = true;
      }
      burger.addEventListener("click", function () {
        var open = sidebar.classList.contains("is-open");
        if (open) close();
        else {
          sidebar.classList.add("is-open");
          burger.setAttribute("aria-expanded", "true");
          backdrop.hidden = false;
        }
      });
      backdrop.addEventListener("click", close);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    })();

    /* Article loader. */
    (function () {
      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      }
      // "YYYY-MM-DD" is a calendar date — build it in LOCAL time. new Date(iso)
      // means UTC midnight, which showed the previous day west of UTC.
      function formatDate(iso) {
        if (!iso) return "";
        var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
        var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
        if (isNaN(d.getTime())) return iso;
        var months = ["ledna","února","března","dubna","května","června",
                      "července","srpna","září","října","listopadu","prosince"];
        return d.getDate() + ". " + months[d.getMonth()] + " " + d.getFullYear();
      }

      /* Visual-editor layout. The editor canvas is 820px wide; older articles
         may hold blocks placed further right (the editor used to be wider), so
         the public canvas grows to include every block, then scales to fit the
         column. Below FLOW_BELOW px the blocks are shown as one readable
         column in reading order instead — scaling would make text tiny. */
      var EDITOR_W = 820;
      var FLOW_BELOW = 560;
      function renderElements(wrap, a) {
        var elements = a.elements;
        var canvasW = EDITOR_W;
        elements.forEach(function (el) {
          var right = (+el.x || 0) + (+el.width || 0);
          if (right > canvasW) canvasW = right;
        });
        var canvas = document.createElement("div");
        canvas.className = "article-canvas";
        canvas.style.width = canvasW + "px";
        applyBackground(canvas, a.background);
        // DOM in reading order (top->bottom, left->right) for the flow layout
        // and screen readers; z-index reproduces the editor's layers.
        var ordered = elements.map(function (el, i) { return { el: el, i: i }; })
          .sort(function (p, q) {
            return ((+p.el.y || 0) - (+q.el.y || 0)) || ((+p.el.x || 0) - (+q.el.x || 0));
          });
        var imgNo = 0;
        ordered.forEach(function (p) {
          var el = p.el;
          var node = document.createElement(el.isTitle ? "h1" : "div");
          node.className = "ac-el ac-el--" + el.type + (el.isTitle ? " ac-title" : "");
          node.style.left = (+el.x || 0) + "px";
          node.style.top = (+el.y || 0) + "px";
          node.style.width = (+el.width || 0) + "px";
          node.style.zIndex = typeof el.z === "number" ? el.z : p.i + 1;
          if (el.height && el.height !== "auto") {
            node.style.height = el.height + "px";
            node.classList.add("has-fixed-h");
          }
          if (el.type === "image") {
            var src = VNSafe.url(el.content, { image: true });
            if (!src) return;
            imgNo++;
            var img = document.createElement("img");
            img.src = src; img.loading = "lazy";
            img.alt = (a.title ? a.title + " — " : "") + "obrázek " + imgNo;
            node.appendChild(img);
          } else if (el.type === "embed") {
            // video / social post: the stored link is re-validated and the
            // player URL rebuilt by VNSafe.embed — plays inline in the article
            var info = VNSafe.embed(el.content);
            if (!info) return;
            node.appendChild(VNSafe.embedFrame(info, (a.title ? a.title + " — " : "") + info.label));
            // keeps the block's shape in the one-column phone layout
            var w = +el.width || info.w, h = +el.height || info.h;
            node.style.aspectRatio = w + " / " + h;
          } else if (el.type === "file") {
            var href = VNSafe.url(el.content);
            if (!href) return;
            var link = document.createElement("a");
            link.className = "ac-file";
            link.href = href; link.target = "_blank"; link.rel = "noopener noreferrer";
            link.textContent = "📄 " + (el.name || "Dokument PDF");
            node.appendChild(link);
          } else {
            node.innerHTML = VNSafe.html(el.content);
            var s = el.styles || {};
            node.style.fontSize = s.fontSize || "16px";
            node.style.color = s.color || "#1a1a1a";
            node.style.fontWeight = s.bold ? "700" : "400";
            node.style.fontStyle = s.italic ? "italic" : "normal";
            node.style.textDecoration = s.underline ? "underline" : "none";
            node.style.textAlign = s.align || "left";
          }
          canvas.appendChild(node);
        });
        wrap.innerHTML = "";
        wrap.appendChild(canvas);
        var doLayout = function () { layoutCanvas(wrap, canvas, canvasW); };
        doLayout();
        window.addEventListener("resize", doLayout);
        // re-measure once images have loaded (their height can change auto rows)
        Array.prototype.forEach.call(canvas.querySelectorAll("img"), function (im) {
          if (!im.complete) im.addEventListener("load", doLayout);
        });
      }
      function layoutCanvas(wrap, canvas, canvasW) {
        var avail = wrap.clientWidth || canvasW;
        var flow = avail < FLOW_BELOW;
        canvas.classList.toggle("article-canvas--flow", flow);
        canvas.style.transform = "none";
        if (flow) { canvas.style.height = ""; wrap.style.height = ""; return; }
        var h = 0;
        Array.prototype.forEach.call(canvas.children, function (n) {
          var b = n.offsetTop + n.offsetHeight;
          if (b > h) h = b;
        });
        h += 40;
        canvas.style.height = h + "px";
        var scale = Math.min(1, avail / canvasW);
        canvas.style.transformOrigin = "top left";
        canvas.style.transform = "scale(" + scale + ")";
        wrap.style.height = (h * scale) + "px";
      }
      // Page background from the editor: image (wins) or a hex colour.
      function applyBackground(node, bg) {
        if (!bg) return;
        var img = bg.image ? VNSafe.cssUrl(bg.image) : "";
        if (img) {
          node.style.backgroundImage = img;
          node.style.backgroundSize = "cover";
          node.style.backgroundPosition = "center";
        }
        if (/^#[0-9a-f]{3,8}$/i.test(bg.color || "")) node.style.backgroundColor = bg.color;
      }

      /* SEO for this article: description, canonical URL, link-preview tags and
         schema.org data. Google runs this script when it indexes the page. */
      function setMeta(selector, attr, value) {
        var el = document.head.querySelector(selector);
        if (el && value) el.setAttribute(attr, value);
      }
      function setSeo(a) {
        var url = location.origin + "/article?id=" + encodeURIComponent(a.id);
        var tmp = document.createElement("template");
        tmp.innerHTML = (a.elements || []).filter(function (el) { return el.type === "text" && !el.isTitle; })
          .map(function (el) { return VNSafe.html(el.content); }).join(" ");
        var text = ((a.body || "") + " " + tmp.content.textContent).replace(/\s+/g, " ").trim();
        var desc = text ? (text.length > 155 ? text.slice(0, 152).replace(/\s+\S*$/, "") + "…" : text)
                        : "Článek ze školního magazínu Vanaheim News.";
        var firstImg = (a.elements || []).filter(function (el) { return el.type === "image"; })[0];
        var image = VNSafe.url(a.image || (firstImg && firstImg.content), { image: true });
        if (!/^https?:/i.test(image)) image = "";
        setMeta('meta[name="description"]', "content", desc);
        setMeta('link[rel="canonical"]', "href", url);
        setMeta('meta[property="og:title"]', "content", a.title);
        setMeta('meta[property="og:description"]', "content", desc);
        setMeta('meta[property="og:image"]', "content", image);
        var og = document.createElement("meta");
        og.setAttribute("property", "og:url"); og.setAttribute("content", url);
        document.head.appendChild(og);
        var ld = document.createElement("script");
        ld.type = "application/ld+json";
        ld.textContent = JSON.stringify({
          "@context": "https://schema.org", "@type": "Article",
          headline: a.title, description: desc, url: url, inLanguage: "cs",
          datePublished: a.publishAt || a.date, dateModified: a.updatedAt || a.publishAt || a.date,
          image: image || undefined,
          author: (a.authors || []).map(function (n) { return { "@type": "Person", name: n }; }),
          publisher: { "@type": "Organization", name: "Vanaheim News" }
        });
        document.head.appendChild(ld);
      }
      // Missing / unpublished article: tell search engines not to index the error page.
      function noIndex() {
        var m = document.createElement("meta");
        m.name = "robots"; m.content = "noindex";
        document.head.appendChild(m);
      }

      var params = new URLSearchParams(location.search);
      var id = params.get("id");
      var root = document.querySelector("#article-root");

      if (!id) {
        root.innerHTML = '<a class="article-back" href="./#articles">← Zpět na příspěvky</a>' +
                         '<p class="error-state">Chybí ID článku.</p>';
        noIndex();
        return;
      }

      fetch("/api/articles?id=" + encodeURIComponent(id))
        .then(function (r) {
          if (!r.ok) throw new Error("Článek nenalezen.");
          return r.json();
        })
        .then(function (a) {
          document.title = (a.title || "Článek") + " — Vanaheim News";
          setSeo(a);
          var tagsHtml = (a.tags || []).map(function (t) {
            return '<span class="card-tag">' + escapeHtml(t) + "</span>";
          }).join("");
          var authors = (a.authors || []).join(", ");
          var metaHtml =
            '<a class="article-back" href="./#articles">← Zpět na příspěvky</a>' +
            '<div class="article-meta">' +
              '<time datetime="' + escapeHtml(a.date) + '">' + escapeHtml(formatDate(a.date)) + "</time>" +
              (authors ? "<span>" + escapeHtml(authors) + "</span>" : "") +
              "<span>" + (a.kind === "comic" ? "Komiks" : "Článek") + "</span>" +
            "</div>" +
            (tagsHtml ? '<div class="article-tags">' + tagsHtml + "</div>" : "");

          if (a.elements && a.elements.length) {
            // Render the exact positioned layout from the visual editor.
            root.innerHTML = metaHtml + '<div class="article-canvas-wrap" id="article-canvas-wrap"></div>';
            renderElements(document.querySelector("#article-canvas-wrap"), a);
          } else {
            var heroSrc = VNSafe.url(a.image, { image: true });
            var heroHtml = heroSrc
              ? '<div class="article-hero"><img src="' + escapeHtml(heroSrc) + '" alt=""></div>'
              : "";
            // blank line = new paragraph, single newline = line break
            var paras = String(a.body || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
            root.innerHTML = metaHtml +
              heroHtml +
              '<h1 class="article-title">' + escapeHtml(a.title) + "</h1>" +
              '<div class="article-body">' + paras.map(function (p) {
                return "<p>" + escapeHtml(p).replace(/\n/g, "<br>") + "</p>";
              }).join("") + "</div>";
          }
        })
        .catch(function (err) {
          noIndex();
          root.innerHTML = '<a class="article-back" href="./#articles">← Zpět na příspěvky</a>' +
                           '<p class="error-state">' + escapeHtml(err.message || "Chyba při načítání.") + "</p>";
        });
    })();
  </script>
</body>
</html>
